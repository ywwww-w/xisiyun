<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>录音转写摘要服务 · 前端控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { height: 100%; }
    .fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .spinner {
      border: 3px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      width: 16px; height: 16px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 9999px; margin-right: 6px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-5xl mx-auto p-6">
    <!-- Header -->
    <header class="mb-8 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">🎙️ 录音转写 · LLM 摘要服务</h1>
        <p class="text-sm text-slate-500 mt-1">上传录音文件 → 自动 Mock 转写 → 调用 DeepSeek 生成结构化摘要（支持 wav/mp3/m4a/aac，≤50MB）</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="healthBadge" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-slate-200 text-slate-600">
          <span class="status-dot bg-slate-400"></span>后端连接中…
        </span>
      </div>
    </header>

    <!-- 1. 上传区 -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8 fade-in">
      <h2 class="text-lg font-semibold mb-4 text-slate-900">📤 上传录音文件</h2>
      <form id="uploadForm" class="space-y-4">
        <label for="fileInput" class="block cursor-pointer">
          <div id="dropZone" class="border-2 border-dashed border-slate-300 hover:border-indigo-500 hover:bg-indigo-50/40 rounded-xl p-8 text-center transition-all">
            <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>
            </svg>
            <p class="mt-3 text-sm font-medium text-slate-700">点此选择文件，或拖拽到此处</p>
            <p id="fileInfo" class="mt-1 text-xs text-slate-500">支持格式：wav / mp3 / m4a / aac · 最大 50MB</p>
          </div>
        </label>
        <input id="fileInput" name="file" type="file" class="hidden" accept=".wav,.mp3,.m4a,.aac,audio/*" />
        <div class="flex items-center justify-between">
          <div id="uploadProgressWrap" class="flex-1 mr-4 hidden">
            <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
              <div id="uploadProgress" class="h-full bg-indigo-600 transition-all" style="width:0%"></div>
            </div>
            <p id="uploadStatus" class="text-xs text-slate-500 mt-1">准备上传…</p>
          </div>
          <button id="uploadBtn" type="submit" disabled
            class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed transition-colors">
            <span id="uploadBtnText">上传并开始处理</span>
            <span id="uploadBtnSpinner" class="spinner hidden"></span>
          </button>
        </div>
      </form>
    </section>

    <!-- 2. 录音列表 -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 fade-in">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-slate-900">📋 历史录音列表</h2>
        <div class="flex items-center gap-2">
          <button id="refreshBtn" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-sm bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M4 9a8 8 0 0 1 14.9-2M20 15a8 8 0 0 1-14.9 2"/>
            </svg>
            刷新
          </button>
        </div>
      </div>

      <!-- 表格 -->
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-xs text-slate-500 uppercase tracking-wider border-b border-slate-200">
              <th class="py-3 px-2 font-medium">文件名</th>
              <th class="py-3 px-2 font-medium">大小</th>
              <th class="py-3 px-2 font-medium">状态</th>
              <th class="py-3 px-2 font-medium">创建时间</th>
              <th class="py-3 px-2 font-medium text-right">操作</th>
            </tr>
          </thead>
          <tbody id="listBody" class="divide-y divide-slate-100">
            <tr><td colspan="5" class="py-12 text-center text-slate-400 text-sm">加载中…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div id="pagination" class="mt-4 flex items-center justify-between text-sm text-slate-600 hidden">
        <div>
          共 <span id="totalCount" class="font-semibold">0</span> 条，第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 页
        </div>
        <div class="flex items-center gap-2">
          <button id="prevBtn" class="px-3 py-1.5 rounded border border-slate-300 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed">上一页</button>
          <button id="nextBtn" class="px-3 py-1.5 rounded border border-slate-300 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed">下一页</button>
        </div>
      </div>
    </section>
  </div>

  <!-- 详情弹窗 -->
  <div id="detailModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-40 items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-hidden fade-in flex flex-col">
      <div class="px-6 py-4 border-b border-slate-200 flex items-start justify-between">
        <div>
          <h3 id="detailTitle" class="text-lg font-semibold text-slate-900">录音详情</h3>
          <p id="detailSubtitle" class="text-xs text-slate-500 mt-0.5"></p>
        </div>
        <button id="closeDetailBtn" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="detailBody" class="p-6 overflow-y-auto flex-1 space-y-5">
        <!-- 动态内容 -->
      </div>
      <div class="px-6 py-3 border-t border-slate-200 flex items-center justify-between bg-slate-50/50">
        <div id="detailFooterLeft" class="text-xs text-slate-500"></div>
        <div class="flex items-center gap-2">
          <button id="retryTaskBtn" class="hidden px-3 py-1.5 rounded-lg bg-amber-500 text-white text-sm font-medium hover:bg-amber-600 transition-colors">
            🔄 重试任务
          </button>
          <button id="deleteBtn" class="px-3 py-1.5 rounded-lg bg-red-500 text-white text-sm font-medium hover:bg-red-600 transition-colors">
            🗑️ 删除录音
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 统一错误弹窗 -->
  <div id="errorModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md fade-in">
      <div class="px-6 pt-5 pb-3 flex items-center gap-3 border-b border-slate-200">
        <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center text-red-600 flex-shrink-0">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
          </svg>
        </div>
        <div>
          <h3 class="text-base font-semibold text-slate-900">出错了</h3>
          <p id="errorCode" class="text-xs text-slate-500"></p>
        </div>
      </div>
      <div class="px-6 py-5">
        <p id="errorMessage" class="text-sm text-slate-700 leading-relaxed"></p>
        <details id="errorDetailsWrap" class="mt-3 hidden">
          <summary class="text-xs text-slate-500 cursor-pointer hover:text-slate-700">显示技术详情</summary>
          <pre id="errorDetails" class="mt-2 p-3 bg-slate-50 rounded-lg text-xs text-slate-600 overflow-x-auto border border-slate-200"></pre>
        </details>
      </div>
      <div class="px-6 py-3 border-t border-slate-200 flex justify-end">
        <button id="closeErrorBtn" class="px-4 py-2 rounded-lg bg-slate-900 text-white text-sm font-medium hover:bg-slate-800 transition-colors">
          知道了
        </button>
      </div>
    </div>
  </div>

  <!-- 成功小提示 toast -->
  <div id="toast" class="fixed top-6 right-6 z-50 hidden">
    <div class="px-4 py-3 rounded-xl bg-emerald-600 text-white text-sm shadow-lg fade-in flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
      </svg>
      <span id="toastText"></span>
    </div>
  </div>

  <script>
  /* =========================================================
   *  配置
   * ========================================================= */
  const API_BASE = (location.protocol === 'file:')
    ? 'http://localhost:8000'
    : (location.origin === 'http://localhost:8000' ? location.origin : 'http://localhost:8000');
  const ALLOWED_EXT = new Set(['wav','mp3','m4a','aac']);
  const MAX_BYTES = 50 * 1024 * 1024;
  const PAGE_SIZE = 10;
  const STATUS_COLORS = {
    pending:      { bg: 'bg-slate-500', text: 'text-slate-700',  pill: 'bg-slate-100', label: '等待中' },
    transcribing: { bg: 'bg-amber-500', text: 'text-amber-700',  pill: 'bg-amber-50', label: '转写中' },
    summarizing:  { bg: 'bg-indigo-500',text: 'text-indigo-700', pill: 'bg-indigo-50', label: '摘要生成中' },
    done:         { bg: 'bg-emerald-500',text:'text-emerald-700',pill: 'bg-emerald-50',label: '处理完成' },
    failed:       { bg: 'bg-red-500',   text: 'text-red-700',    pill: 'bg-red-50',    label: '处理失败' },
  };

  /* =========================================================
   *  工具函数
   * ========================================================= */
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);
  const fmtSize = (b) => {
    if (b < 1024) return `${b} B`;
    if (b < 1024*1024) return `${(b/1024).toFixed(1)} KB`;
    return `${(b/1024/1024).toFixed(2)} MB`;
  };
  const fmtTime = (iso) => iso ? new Date(iso).toLocaleString('zh-CN', { hour12: false }) : '-';
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  function statusPill(status) {
    const c = STATUS_COLORS[status] || STATUS_COLORS.pending;
    return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ${c.pill} ${c.text}">
      <span class="status-dot ${c.bg}"></span>${c.label}
    </span>`;
  }

  /* =========================================================
   *  错误弹窗（统一）
   * ========================================================= */
  function showError(titleOrErr, message, code, details) {
    // 支持三种调用方式：
    //   1. showError(new Error('msg')) —— 最安全，instanceof Error 分支
    //   2. showError('标题', '内容', '错误码', {... details ...}) —— 4 个独立参数
    //   3. showError({ message: 'xxx', stack?: 'xxx', code?: 'xxx', details?: ... }) —— 兼容老代码误传对象
    let ttl = '出错了', msg = '', cd = '', det = null;
    if (titleOrErr instanceof Error) {
      msg = titleOrErr.message || '未知错误';
      det = titleOrErr.stack || titleOrErr.cause || null;
    } else if (
      titleOrErr !== null
      && typeof titleOrErr === 'object'
      && (typeof titleOrErr.message === 'string'
        || typeof titleOrErr.stack === 'string'
        || typeof titleOrErr.code === 'string'
        || titleOrErr.details !== undefined)
    ) {
      // 兼容老代码误传的普通对象：取它的 message / code / stack / details
      const obj = titleOrErr;
      ttl = typeof obj.title === 'string' ? obj.title : (typeof obj.code === 'string' ? `请求失败（${obj.code}）` : '出错了');
      msg = typeof obj.message === 'string' ? obj.message : (String(obj) !== '[object Object]' ? String(obj) : '');
      cd = typeof obj.code === 'string' ? obj.code : '';
      if (obj.details !== undefined && obj.details !== null) det = obj.details;
      else if (typeof obj.stack === 'string' && obj.stack.trim()) det = obj.stack;
      // 兜底：如果以上字段全取到还空，就把整个对象序列化到 details 方便调试
      if (!msg && !cd && det === null) det = JSON.stringify(obj, null, 2);
      // 再兜底 msg：如果对象根本没有 message 字段但 code 存在，给个默认友好话术
      if (!msg && cd) msg = `操作失败（错误码：${cd}），已记录技术详情，可展开查看。`;
      if (!msg && !cd) msg = '发生了一个未分类的错误，请展开「技术详情」查看原始信息';
    } else {
      ttl = titleOrErr || '出错了';
      msg = message || '';
      cd = code || '';
      det = details || null;
    }
    $('#errorModal h3').textContent = ttl;
    $('#errorMessage').textContent = msg;
    $('#errorCode').textContent = cd ? `错误码：${cd}` : '';
    const detOk = !!(det && (typeof det === 'object' ? Object.keys(det).length : String(det).trim()));
    if (detOk) {
      $('#errorDetailsWrap').classList.remove('hidden');
      $('#errorDetails').textContent = typeof det === 'object' ? JSON.stringify(det, null, 2) : String(det);
    } else {
      $('#errorDetailsWrap').classList.add('hidden');
    }
    $('#errorModal').classList.remove('hidden');
    $('#errorModal').classList.add('flex');
  }
  $('#closeErrorBtn').addEventListener('click', () => {
    $('#errorModal').classList.add('hidden');
    $('#errorModal').classList.remove('flex');
  });
  $('#errorModal').addEventListener('click', (e) => {
    if (e.target.id === 'errorModal') $('#closeErrorBtn').click();
  });

  /* =========================================================
   *  Toast
   * ========================================================= */
  let toastTimer = null;
  function showToast(text, duration = 2500) {
    $('#toastText').textContent = text;
    $('#toast').classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('#toast').classList.add('hidden'), duration);
  }

  /* =========================================================
   *  HTTP 调用（统一错误处理）
   * ========================================================= */
  async function api(path, opts = {}, { onProgress } = {}) {
    const url = `${API_BASE}${path}`;
    const xhr = new XMLHttpRequest();
    xhr.open(opts.method || 'GET', url, true);
    Object.entries(opts.headers || {}).forEach(([k,v]) => xhr.setRequestHeader(k, v));
    if (onProgress && xhr.upload) {
      xhr.upload.onprogress = (e) => e.lengthComputable && onProgress(e.loaded / e.total);
    }
    return new Promise((resolve, reject) => {
      xhr.onload = async () => {
        let body = null;
        try { body = xhr.responseText ? JSON.parse(xhr.responseText) : null; }
        catch { body = { raw: xhr.responseText }; }

        if (xhr.status >= 200 && xhr.status < 300) {
          resolve({ status: xhr.status, body });
        } else {
          // 统一错误结构：后端返回 {"error":{"code":"...","message":"...","details":...}}
          const err = body && body.error ? body.error : { code: `HTTP_${xhr.status}`, message: xhr.statusText || `请求失败（HTTP ${xhr.status}）` };
          const msgMap = {
            413: '文件过大！最大支持 50MB，请压缩后再上传。',
            415: '文件格式不支持！仅支持 wav / mp3 / m4a / aac 四种音频格式。',
            404: '资源不存在（可能已被删除）。',
            409: '操作冲突：任务状态不允许此操作（例如只能重试 failed 状态的任务）。',
            422: '请求参数非法（详情见技术细节）。',
          };
          const humanMsg = msgMap[xhr.status] || err.message || `请求失败（HTTP ${xhr.status}）`;
          showError({ message: humanMsg, stack: err.details ? JSON.stringify(err.details, null, 2) : (body && body.raw) || JSON.stringify(body, null, 2) || xhr.statusText });
          reject(Object.assign(new Error(humanMsg), { status: xhr.status, code: err.code, details: err.details, body }));
        }
      };
      xhr.onerror = () => {
        const err = new Error('无法连接到后端服务！请确认：1）uvicorn 已经启动（端口 8000）；2）后端已加 CORS 中间件；3）API_BASE 配置正确。');
        showError(err);
        reject(err);
      };
      xhr.send(opts.body || null);
    });
  }

  /* =========================================================
   *  健康检查
   * ========================================================= */
  async function checkHealth() {
    try {
      await api('/health');
      $('#healthBadge').className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700';
      $('#healthBadge').innerHTML = '<span class="status-dot bg-emerald-500"></span>后端已连接';
      return true;
    } catch (e) {
      $('#healthBadge').className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-red-100 text-red-700';
      $('#healthBadge').innerHTML = '<span class="status-dot bg-red-500"></span>后端未连接';
      return false;
    }
  }

  /* =========================================================
   *  上传流程
   * ========================================================= */
  let currentFile = null;
  const $fileInfo = $('#fileInfo');

  function validateFile(f) {
    if (!f) return '请先选择一个文件';
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if (!ALLOWED_EXT.has(ext)) return `不支持的文件格式 ".${ext}"，仅支持：${[...ALLOWED_EXT].join(' / ')}`;
    if (f.size <= 0) return '文件为空，请检查';
    if (f.size > MAX_BYTES) return `文件大小 ${fmtSize(f.size)} 超过上限 50MB（${fmtSize(MAX_BYTES)}）`;
    return null;
  }

  function pickFile(f) {
    currentFile = f;
    const validationError = validateFile(f);
    if (validationError) {
      $('#uploadBtn').disabled = true;
      $fileInfo.className = 'mt-1 text-xs text-red-600';
      $fileInfo.innerHTML = `❌ ${validationError}`;
      return;
    }
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    $('#uploadBtn').disabled = false;
    $fileInfo.className = 'mt-1 text-xs text-slate-600';
    $fileInfo.innerHTML = `✅ 已选择：<strong>${f.name}</strong>（${fmtSize(f.size)} · ${ext.toUpperCase()}）`;
  }

  $('#fileInput').addEventListener('change', (e) => pickFile(e.target.files[0]));
  $('#dropZone').addEventListener('click', (e) => {
    // 让点击整个区域都能弹文件选择框（外层是 label 指向 input，这里兜底）
  });
  // 拖拽支持
  ['dragenter','dragover'].forEach(ev =>
    $('#dropZone').addEventListener(ev, (e) => { e.preventDefault(); $('#dropZone').classList.add('border-indigo-500','bg-indigo-50/50'); })
  );
  ['dragleave','drop'].forEach(ev =>
    $('#dropZone').addEventListener(ev, (e) => { e.preventDefault(); $('#dropZone').classList.remove('border-indigo-500','bg-indigo-50/50'); })
  );
  $('#dropZone').addEventListener('drop', (e) => {
    if (e.dataTransfer.files && e.dataTransfer.files[0]) pickFile(e.dataTransfer.files[0]);
  });

  $('#uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = validateFile(currentFile);
    if (err) { showError({ message: err }); return; }

    $('#uploadBtn').disabled = true;
    $('#uploadBtnSpinner').classList.remove('hidden');
    $('#uploadBtnText').textContent = '上传中…';
    $('#uploadProgressWrap').classList.remove('hidden');
    $('#uploadProgress').style.width = '0%';
    $('#uploadStatus').textContent = '上传字节到后端…';

    try {
      const fd = new FormData();
      fd.append('file', currentFile, currentFile.name);
      const { body } = await api('/v1/recordings', { method: 'POST', body: fd }, {
        onProgress: (pct) => {
          $('#uploadProgress').style.width = `${Math.max(3, Math.round(pct * 95))}%`;
        }
      });
      $('#uploadProgress').style.width = '100%';
      $('#uploadStatus').textContent = `✅ 上传成功！任务已入队（ID: ${body.task_id.slice(0,8)}…），后台正在处理…`;
      showToast('上传成功，后台开始处理！');
      currentFile = null;
      $('#fileInput').value = '';
      $fileInfo.innerHTML = '支持格式：wav / mp3 / m4a / aac · 最大 50MB';
      // 稍等一下再把 UI 恢复
      await sleep(1500);
      $('#uploadProgressWrap').classList.add('hidden');
      $('#uploadBtnText').textContent = '上传并开始处理';
      $('#uploadBtnSpinner').classList.add('hidden');
      await loadList();
      // 自动打开详情
      openDetail(body.recording_id);
    } catch (e) {
      // 错误已经在 api() 里 showError 弹过
      $('#uploadBtnText').textContent = '上传并开始处理';
      $('#uploadBtnSpinner').classList.add('hidden');
      $('#uploadBtn').disabled = !!currentFile ? false : true;
      $('#uploadProgressWrap').classList.add('hidden');
    }
  });

  /* =========================================================
   *  列表
   * ========================================================= */
  let state = { page: 1, total: 0, items: [], pollingIds: new Set() };

  async function loadList() {
    try {
      const { body } = await api(`/v1/recordings?page=${state.page}&page_size=${PAGE_SIZE}`);
      state.items = body.items || [];
      state.total = body.total || 0;
      const totalPages = Math.max(1, Math.ceil(state.total / PAGE_SIZE));
      $('#totalCount').textContent = state.total;
      $('#currentPage').textContent = state.page;
      $('#totalPages').textContent = totalPages;
      $('#pagination').classList.toggle('hidden', state.total === 0);
      $('#prevBtn').disabled = state.page <= 1;
      $('#nextBtn').disabled = state.page >= totalPages;

      if (state.items.length === 0) {
        $('#listBody').innerHTML = `<tr><td colspan="5" class="py-16 text-center text-slate-400 text-sm">📭 暂无录音，先在上方上传一个吧～</td></tr>`;
        return;
      }
      $('#listBody').innerHTML = state.items.map(r => `
        <tr class="hover:bg-slate-50/60 transition-colors">
          <td class="py-3 px-2">
            <div class="font-medium text-slate-800 truncate max-w-xs" title="${r.original_filename}">📎 ${r.original_filename}</div>
            <div class="text-xs text-slate-400 mt-0.5">ID: ${r.id.slice(0,12)}… · ${r.file_ext.toUpperCase()}</div>
          </td>
          <td class="py-3 px-2 text-slate-600">${fmtSize(r.file_size_bytes)}</td>
          <td class="py-3 px-2">${statusPill(r.last_status)}</td>
          <td class="py-3 px-2 text-slate-500 whitespace-nowrap text-xs">${fmtTime(r.created_at)}</td>
          <td class="py-3 px-2 text-right">
            <button class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 text-xs hover:bg-slate-200 transition-colors" onclick="openDetail('${r.id}')">查看详情</button>
          </td>
        </tr>
      `).join('');
    } catch (e) { /* api() 已弹窗 */ }
  }
  $('#refreshBtn').addEventListener('click', loadList);
  $('#prevBtn').addEventListener('click', () => { if (state.page > 1) { state.page--; loadList(); } });
  $('#nextBtn').addEventListener('click', () => { state.page++; loadList(); });

  /* =========================================================
   *  详情 + 轮询
   * ========================================================= */
  let currentDetailId = null;
  let pollTimer = null;

  function clearPoll() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function renderDetail(r, task = null) {
    const c = STATUS_COLORS[r.last_status] || STATUS_COLORS.pending;
    $('#detailTitle').textContent = r.original_filename;
    $('#detailSubtitle').textContent = `${fmtSize(r.file_size_bytes)} · ${r.file_ext.toUpperCase()} · 创建于 ${fmtTime(r.created_at)}`;

    const parts = [];
    // 状态卡
    parts.push(`
      <div class="p-4 rounded-xl ${c.pill} border border-slate-200 flex items-center justify-between">
        <div class="flex items-center gap-3">
          ${statusPill(r.last_status)}
          ${task && r.last_status !== 'done' && r.last_status !== 'failed' ? `<span class="text-xs text-slate-500">阶段重试：${task.current_stage_retry_count || 0}/3 · 总手动重试：${task.total_retry_count || 0}</span>` : ''}
          ${task && r.last_status === 'failed' ? `<span class="text-xs text-red-600">${task.error_message || '处理失败，可点击右下角「重试任务」'}</span>` : ''}
        </div>
        ${(['pending','transcribing','summarizing'].includes(r.last_status)) ? '<div class="inline-flex items-center gap-2 text-xs text-slate-500"><span class="spinner !border-slate-300 !border-t-slate-500"></span>处理中，自动刷新…</div>' : ''}
      </div>
    `);

    // transcript
    if (r.last_status === 'done' && r.transcript) {
      parts.push(`
        <div>
          <h4 class="text-sm font-semibold text-slate-900 mb-2 flex items-center gap-2">
            <span class="w-1 h-4 rounded bg-amber-400"></span>转写文本（共 ${r.transcript.length} 字）
          </h4>
          <div class="p-4 bg-amber-50/50 rounded-xl text-sm leading-relaxed text-slate-700 border border-amber-100 max-h-64 overflow-y-auto whitespace-pre-wrap">${r.transcript}</div>
        </div>
      `);
    }
    if (r.last_status !== 'done' && r.last_status !== 'failed') {
      parts.push(`
        <div>
          <h4 class="text-sm font-semibold text-slate-900 mb-2 flex items-center gap-2">
            <span class="w-1 h-4 rounded bg-slate-300"></span>转写与摘要
          </h4>
          <p class="text-sm text-slate-500 p-4 bg-slate-50 rounded-xl border border-slate-200">
            当前状态：<strong>${c.label}</strong>。转写约 5~15 秒，LLM 摘要约 3~30 秒，本窗口每 2 秒自动刷新，请耐心等待…
          </p>
        </div>
      `);
    }

    // summary
    if (r.last_status === 'done' && r.summary) {
      parts.push(`
        <div>
          <h4 class="text-sm font-semibold text-slate-900 mb-2 flex items-center gap-2">
            <span class="w-1 h-4 rounded bg-indigo-400"></span>一句话摘要
          </h4>
          <div class="p-4 bg-indigo-50/50 rounded-xl text-slate-700 border border-indigo-100">${r.summary.summary || '-'}</div>
        </div>
      `);
      const kp = r.summary.key_points || [];
      parts.push(`
        <div>
          <h4 class="text-sm font-semibold text-slate-900 mb-2 flex items-center gap-2">
            <span class="w-1 h-4 rounded bg-emerald-400"></span>关键要点 <span class="text-xs font-normal text-slate-500">（${kp.length} 条）</span>
          </h4>
          <ul class="space-y-2">
            ${kp.map(p => `<li class="flex gap-2 text-sm p-3 bg-slate-50 rounded-lg"><span class="text-emerald-500 mt-0.5">✅</span><span class="text-slate-700">${p}</span></li>`).join('')}
          </ul>
        </div>
      `);
      const td = r.summary.todos || [];
      parts.push(`
        <div>
          <h4 class="text-sm font-semibold text-slate-900 mb-2 flex items-center gap-2">
            <span class="w-1 h-4 rounded bg-rose-400"></span>待办事项 <span class="text-xs font-normal text-slate-500">（${td.length} 条）</span>
          </h4>
          <ul class="space-y-2">
            ${td.map(p => `<li class="flex gap-2 text-sm p-3 bg-rose-50 rounded-lg"><span class="text-rose-500 mt-0.5">📌</span><span class="text-slate-700">${p}</span></li>`).join('')}
          </ul>
        </div>
      `);
    }
    if (r.last_status === 'failed') {
      parts.push(`
        <div>
          <h4 class="text-sm font-semibold text-slate-900 mb-2 flex items-center gap-2">
            <span class="w-1 h-4 rounded bg-red-400"></span>失败信息
          </h4>
          <div class="p-4 bg-red-50 rounded-xl text-sm text-slate-700 border border-red-100">
            <strong>错误：</strong>${task && task.error_message ? task.error_message : '未知错误（可点右下角「重试任务」）'}
          </div>
        </div>
      `);
    }
    $('#detailBody').innerHTML = parts.join('');

    // footer 按钮显示
    $('#retryTaskBtn').classList.toggle('hidden', r.last_status !== 'failed');
    const leftFoot = [];
    if (task) {
      leftFoot.push(`总重试次数：${task.total_retry_count || 0}`);
      leftFoot.push(`任务ID：${task.id.slice(0,12)}…`);
    }
    leftFoot.push(`录制ID：${r.id.slice(0,12)}…`);
    $('#detailFooterLeft').textContent = leftFoot.join('  ·  ');
  }

  async function openDetail(recordingId) {
    clearPoll();
    currentDetailId = recordingId;
    $('#detailModal').classList.remove('hidden');
    $('#detailModal').classList.add('flex');
    $('#detailTitle').textContent = '加载中…';
    $('#detailSubtitle').textContent = '';
    $('#detailBody').innerHTML = `<div class="py-12 flex flex-col items-center text-slate-400 text-sm"><span class="spinner !border-slate-300 !border-t-indigo-500 !w-8 !h-8"></span><p class="mt-3">正在获取详情…</p></div>`;
    try {
      const [recResp, taskResp] = await Promise.all([
        api(`/v1/recordings/${recordingId}`),
        // 先拿 recording，再找 task_id —— 由于详情接口没返回 task_id，我们先拿列表里找或者重试：其实从 recording.id 可以通过 tasks 外键查，但路由没提供。
        // 退而求其次：task 信息在 GET /tasks 里找 recording_id = 当前 id 的。
        // 简单起见：先不查 task，拿失败信息的话 retry 按钮直接查 tasks 表第一个 by recording_id。
        (async () => {
          const { body: listBody } = await api(`/v1/tasks?page=1&page_size=100`);
          // 如果没 /v1/tasks 路由，这里退回 null
          return listBody && listBody.items ? listBody.items.find(t => t.recording_id === recordingId) || null : null;
        })().catch(() => null),
      ]);
      renderDetail(recResp.body, taskResp);
      // 如果不是 terminal，启动轮询
      if (!['done','failed'].includes(recResp.body.last_status)) {
        pollTimer = setInterval(async () => {
          try {
            const { body: r } = await api(`/v1/recordings/${recordingId}`);
            let task = null;
            try {
              const { body: lb } = await api(`/v1/tasks?page=1&page_size=100`);
              task = lb && lb.items ? lb.items.find(t => t.recording_id === recordingId) || null : null;
            } catch {}
            renderDetail(r, task);
            if (['done','failed'].includes(r.last_status)) {
              clearPoll();
              loadList();
              showToast(r.last_status === 'done' ? '🎉 处理完成！' : '⚠️ 处理失败，可点击重试');
            }
          } catch (e) { /* ignore in poll */ }
        }, 2000);
      }
    } catch (e) {
      $('#closeDetailBtn').click();
    }
  }
  window.openDetail = openDetail;

  $('#closeDetailBtn').addEventListener('click', () => {
    clearPoll();
    currentDetailId = null;
    $('#detailModal').classList.add('hidden');
    $('#detailModal').classList.remove('flex');
    loadList();
  });
  $('#detailModal').addEventListener('click', (e) => { if (e.target.id === 'detailModal') $('#closeDetailBtn').click(); });

  // 删除
  $('#deleteBtn').addEventListener('click', async () => {
    if (!currentDetailId) return;
    if (!confirm('确定要删除这条录音吗？\n\n删除后数据库和本地文件都会被永久清除，无法恢复！')) return;
    try {
      await api(`/v1/recordings/${currentDetailId}`, { method: 'DELETE' });
      showToast('已删除录音');
      $('#closeDetailBtn').click();
    } catch (e) { /* api 已弹窗 */ }
  });

  // 重试任务（只有 failed 状态显示）
  $('#retryTaskBtn').addEventListener('click', async () => {
    if (!currentDetailId) return;
    // 先找到 task_id：从 tasks 列表找 recording_id = currentDetailId 的第一条
    try {
      const { body: lb } = await api(`/v1/tasks?page=1&page_size=100`);
      const task = lb && lb.items ? lb.items.find(t => t.recording_id === currentDetailId) : null;
      if (!task) { showError({ message: '找不到对应 task_id，请先刷新列表' }); return; }
      await api(`/v1/tasks/${task.id}/retry`, { method: 'POST' });
      showToast('已触发重试，重新进入处理队列');
      // 重开详情刷新状态
      openDetail(currentDetailId);
    } catch (e) { /* api 已弹窗（409 等） */ }
  });

  /* =========================================================
   *  启动
   * ========================================================= */
  (async function init() {
    await checkHealth();
    setInterval(checkHealth, 15000);
    await loadList();
  })();
  </script>
</body>
</html>
